[project]
name = "release-holic-backend"
version = "0.1.0"
description = "Evidence-backed cross-media release tracking"
requires-python = ">=3.12"
dependencies = [
  "django>=5.2,<5.3",
  "django-ninja>=1.4,<2",
  "django-cors-headers>=4.7,<5",
  "dj-database-url>=2.3,<4",
  "psycopg[binary]>=3.2,<4",
  "celery>=5.5,<6",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-ai-slim[openai,anthropic,google]>=1,<3",
  "scrapy>=2.13,<3",
  "scrapy-playwright>=0.0.43,<1",
  "feedparser>=6.0,<7",
  "trafilatura>=2,<3",
  "cryptography>=44",
  "python-dotenv>=1,<2",
  "gunicorn>=23,<24",
  "whitenoise>=6.9,<7",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
